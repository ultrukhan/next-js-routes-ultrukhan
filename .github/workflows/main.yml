name: Tests Workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Autograding
    # Skip the template repo itself and the first push GitHub makes
    # when someone creates a repository from this template.
    if: ${{ !github.event.repository.is_template && (github.event_name != 'push' || !github.event.created) }}
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cypress tests
        uses: cypress-io/github-action@v7
        with:
          start: npm run dev:e2e
          wait-on: 'http://127.0.0.1:3456'
          wait-on-timeout: 120
          browser: chrome
